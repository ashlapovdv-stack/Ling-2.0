name: Fix camera import

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add missing CameraX import
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/ling20/translator/CameraModeScreen.kt')
          text = path.read_text()
          needle = 'import androidx.camera.core.ImageCapture\n'
          addition = 'import androidx.camera.core.ImageCapture\nimport androidx.camera.core.ImageCaptureException\n'
          if 'import androidx.camera.core.ImageCaptureException' not in text:
              if needle not in text:
                  raise SystemExit('ImageCapture import not found')
              text = text.replace(needle, addition, 1)
          path.write_text(text)
          PY

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "Ling CI"
          git config user.email "actions@github.com"
          git rm .github/workflows/fix-camera-import.yml
          git add app/src/main/java/com/ling20/translator/CameraModeScreen.kt
          git commit -m "Fix CameraX capture callback import"
          git push
