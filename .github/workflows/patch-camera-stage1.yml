name: Apply camera stage one

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire camera screen
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/ling20/translator/LingApp.kt')
          text = path.read_text()
          old = '''                AppSection.CAMERA -> ComingSoon(
                    title = "Камера",
                    description = "Перевод текста со снимка и изображения из галереи будет добавлен следующим этапом.",
                    camera = true,
                )'''
          new = '''                AppSection.CAMERA -> CameraModeScreen(
                    defaultSource = defaultSource.language,
                    defaultTarget = defaultTarget,
                )'''
          if old not in text:
              raise SystemExit('Camera placeholder block not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit camera wiring
        shell: bash
        run: |
          git config user.name "Ling CI"
          git config user.email "actions@github.com"
          git rm .github/workflows/patch-camera-stage1.yml
          git add app/src/main/java/com/ling20/translator/LingApp.kt
          git commit -m "Enable camera capture and gallery mode"
          git push
