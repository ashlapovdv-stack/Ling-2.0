name: Patch OCR cleanup refinement

on:
  push:
    branches: [ main ]
    paths:
      - '.github/scripts/patch_ocr_cleanup.py'
      - '.github/workflows/patch-ocr-cleanup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply OCR cleanup patch
        run: python .github/scripts/patch_ocr_cleanup.py

      - name: Commit OCR cleanup refinement
        run: |
          git config user.name "Ling CI"
          git config user.email "actions@github.com"
          git add app/src/main/java/com/ling20/translator/CameraOcr.kt app/build.gradle.kts
          git rm .github/scripts/patch_ocr_cleanup.py .github/workflows/patch-ocr-cleanup.yml
          git commit -m "Refine OCR block cleanup"
          git push
