name: Patch v0.1.10

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0.1.10 changes
        run: python3 tools/patch_v0110.py

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "Patch already applied"
            exit 0
          fi
          git config user.name "Ling CI"
          git config user.email "actions@github.com"
          git add app/build.gradle.kts app/src/main/AndroidManifest.xml app/src/main/java/com/ling20/translator/LingApp.kt
          git commit -m "Fix launcher icon and add default output language"
          git push
