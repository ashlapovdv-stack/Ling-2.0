name: Patch camera OCR geometry

on:
  push:
    paths:
      - 'scripts/patch_camera_ocr_geometry.py'
      - '.github/workflows/patch-camera-ocr-geometry.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply OCR geometry patch
        run: python scripts/patch_camera_ocr_geometry.py
      - name: Commit OCR geometry refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/ling20/translator/CameraOcr.kt app/src/main/java/com/ling20/translator/CameraModeScreen.kt app/build.gradle.kts
          git diff --cached --quiet || git commit -m "Refine OCR line and word geometry"
          git push
