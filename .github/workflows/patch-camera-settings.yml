name: Patch camera default language settings

on:
  push:
    paths:
      - '.github/workflows/patch-camera-settings.yml'
      - '.github/patch_camera_settings.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/patch_camera_settings.py

      - name: Commit patch
        run: |
          git config user.name "Ling CI"
          git config user.email "actions@github.com"
          git rm .github/workflows/patch-camera-settings.yml .github/patch_camera_settings.py
          git add app/src/main/java/com/ling20/translator/LingApp.kt app/src/main/java/com/ling20/translator/CameraModeScreen.kt app/build.gradle.kts
          git commit -m "Add camera default language settings"
          git push
