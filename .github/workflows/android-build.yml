name: Android build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Install Android native toolchain
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "ndk;29.0.14206865" \
            "cmake;3.31.6"

      - name: Bundle offline OCR language data
        shell: bash
        run: |
          set -euo pipefail
          TESSDATA_COMMIT="e12c65a915945e4c28e237a9b52bc4a8f39a0cec"
          TESSDATA_DIR="app/src/main/assets/tessdata"
          mkdir -p "$TESSDATA_DIR"
          for lang in eng rus chi_sim; do
            curl --fail --location --retry 3 \
              "https://raw.githubusercontent.com/tesseract-ocr/tessdata_best/${TESSDATA_COMMIT}/${lang}.traineddata" \
              --output "${TESSDATA_DIR}/${lang}.traineddata"
            test -s "${TESSDATA_DIR}/${lang}.traineddata"
          done
          ls -lh "$TESSDATA_DIR"

      - name: Prepare stable debug signing
        run: base64 --decode .github/ling-debug-keystore.b64 > app/ling-debug.keystore

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ling-2-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
