name: Patch OCR quality refinement

on:
  push:
    branches: [ main ]
    paths:
      - '.github/patch_ocr_quality.py'
      - '.github/workflows/patch-ocr-quality.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply OCR quality patch
        run: python .github/patch_ocr_quality.py
      - name: Commit OCR quality refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/patch_ocr_quality.py .github/workflows/patch-ocr-quality.yml
          git add -A
          git commit -m "Improve camera OCR recognition quality"
          git push
