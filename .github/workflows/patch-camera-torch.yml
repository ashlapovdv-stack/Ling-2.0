name: Patch camera torch and flags

on:
  push:
    paths:
      - '.github/workflows/patch-camera-torch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/scripts/patch-camera-torch.py

      - name: Commit patch
        run: |
          git config user.name "Ling CI"
          git config user.email "actions@github.com"
          git rm .github/workflows/patch-camera-torch.yml .github/scripts/patch-camera-torch.py
          git add app/src/main/java/com/ling20/translator/CameraModeScreen.kt app/build.gradle.kts
          git commit -m "Replace camera switch with torch and restore flags"
          git push
