name: Patch camera OCR speed

on:
  push:
    paths:
      - 'scripts/patch_camera_ocr_speed.py'
      - '.github/workflows/patch-camera-ocr-speed.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply OCR speed patch
        run: python scripts/patch_camera_ocr_speed.py
      - name: Commit OCR speed refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/ling20/translator/CameraOcr.kt app/build.gradle.kts
          git diff --cached --quiet || git commit -m "Optimize hybrid camera OCR speed and merging"
          git push
